name: Bug report
description: Report a reproducible problem without sharing private Session data.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not upload real Codex Session files, databases, tokens, project paths or unredacted screenshots.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac architecture
      placeholder: "macOS 15.6, Apple Silicon"
    validations:
      required: true
  - type: dropdown
    id: codex
    attributes:
      label: Codex installation
      options:
        - ChatGPT desktop app
        - Codex CLI
        - Both
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed task content, project paths, tokens and account identifiers.
          required: true
